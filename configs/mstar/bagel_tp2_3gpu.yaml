# M* BAGEL on 3 XPUs, official XPU TP2 layout (external/mstar/configs/bagel_xpu_tp2.yaml):
#   rank 0: ViT/VAE      ranks 1,2: LLM, tensor parallel 2.   accelerator_graph: false.
model: "bagel"
model_kwargs:
  accelerator_graph: false
max_seq_len: 8192
max_concurrent_requests: 1

resources:
  kv:
    max_seq_len: 8192
    page_size: 64
    max_num_pages: 512
  attn:
    backend: "xpu_paged"

node_groups:
  - node_names: [vit_encoder, vae_encoder, vae_decoder]
    ranks: [0]
  - node_names: [LLM]
    ranks: [1, 2]
    tp_size: 2
