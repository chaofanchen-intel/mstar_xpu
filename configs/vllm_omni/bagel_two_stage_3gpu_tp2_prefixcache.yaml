# vLLM-Omni BAGEL two-stage on 3 XPUs: Thinker tensor-parallel 2 on @GPU_A@,@GPU_B@; DiT on @GPU_C@.
# Thinker enforce_eager: true. DiT stays eager.
async_chunk: false

stages:
  - stage_id: 0
    max_num_batched_tokens: 8192
    max_num_seqs: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.9
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: true
    tensor_parallel_size: 2
    devices: "@GPU_A@,@GPU_B@"
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 52
      detokenize: true
      repetition_penalty: 1.05

  - stage_id: 1
    max_num_batched_tokens: 8192
    max_num_seqs: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.9
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "@GPU_C@"
    input_connectors:
      from_stage_0: shared_memory_connector
    default_sampling_params:
      seed: 52

connectors:
  shared_memory_connector:
    name: SharedMemoryConnector
